seed: 42

optuna:
  n_trials: 20

lgbm:
  learning_rate: [0.001, 0.1]
  max_depth:     [3, 12]
  subsample:     [0.5, 1.0]
  colsample:     [0.5, 1.0]
  n_estimators:  1000
  early_stopping_rounds: 50

xgb:
  learning_rate: [0.001, 0.1]
  max_depth:     [3, 12]
  subsample:     [0.5, 1.0]
  colsample:     [0.5, 1.0]
  n_estimators:  [100, 1000]
  early_stopping_rounds: 50

cat:
  learning_rate: [0.01, 0.1]
  depth:         [4, 10]
  subsample:     [0.5, 1.0]
  colsample:     [0.5, 1.0]
  iterations:    2000
  early_stopping_rounds: 50

mlp:
  n_layers:      [1, 3]
  units:         [32, 256]
  learning_rate: [0.0001, 0.01]
  dropout:       [0.0, 0.5]
  batch_size:    256
  max_epochs:    50
  patience:      10
  step_units:    32
  batch_sizes:   [128, 512]
  step_batch:    128

cv:
  n_splits: 5

baseline:
  rf_n_estimators: 100

output: results_summary.csv

